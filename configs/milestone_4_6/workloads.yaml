schema_version: m46-workload-suite-v1
threshold: 0.5
operation: and
datasets:
  amazon_all_beauty:
    path: data/milestone_4_6/amazon_all_beauty.parquet
    provenance: https://amazon-reviews-2023.github.io/
    domain: Amazon Reviews'23 All_Beauty customer reviews
    predicates:
      beauty_malfunction:
        instructions: >-
          Does the reviewer report that the product failed, broke, leaked, stopped working,
          or did not perform its intended function? Judge only what the review states.
      beauty_hard_to_use:
        instructions: >-
          Does the reviewer describe substantial difficulty applying, operating, assembling,
          or understanding how to use the product, rather than a minor preference?
      beauty_adverse_reaction:
        instructions: >-
          Does the reviewer report an adverse physical reaction such as irritation, rash,
          burning, pain, swelling, allergy, or other harm caused by the product?
      beauty_packaging_failure:
        instructions: >-
          Does the reviewer report damaged, leaking, broken, unsealed, contaminated, empty,
          or otherwise defective product packaging on arrival or during normal use?
      beauty_return_or_refund:
        instructions: >-
          Does the reviewer say they returned the product, requested or received a refund or
          replacement, or clearly intend to return it because of the reported problem?
      beauty_poor_value:
        instructions: >-
          Does the reviewer explicitly characterize the product as overpriced, poor value,
          too little product for the price, or a waste of money?
  banking77_queries:
    path: data/milestone_4_6/banking77_queries.parquet
    provenance: https://github.com/PolyAI-LDN/task-specific-datasets/tree/master/banking_data
    domain: Banking77 real online-banking customer-service queries
    predicates:
      banking_unauthorized_activity:
        instructions: >-
          Does the customer report or ask about a transaction, withdrawal, payment, transfer,
          account action, or card use that they did not authorize or do not recognize?
      banking_card_related:
        instructions: >-
          Is the customer's issue specifically about a physical or virtual payment card,
          including delivery, activation, PIN, contactless use, card payment, loss, or theft?
      banking_transfer_related:
        instructions: >-
          Is the customer asking about or reporting a bank transfer, international transfer,
          beneficiary transfer, recipient transfer, or cancellation or status of a transfer?
      banking_cash_withdrawal:
        instructions: >-
          Is the customer's issue about withdrawing cash or an ATM event, including fees,
          an unrecognized withdrawal, cash not received, or a card retained by an ATM?
      banking_refund_or_reversal:
        instructions: >-
          Is the customer asking about a refund, chargeback, cancellation, reversal, returned
          money, or why money from a reversed or refunded transaction has not arrived?
      banking_access_or_verification:
        instructions: >-
          Is the customer's issue about accessing or securing the account, identity
          verification, a passcode, password, PIN, compromised credentials, or account lockout?
workloads:
  - id: beauty_failure_usability_return
    dataset: amazon_all_beauty
    predicate_ids: [beauty_malfunction, beauty_hard_to_use, beauty_return_or_refund]
    original_order: [beauty_malfunction, beauty_hard_to_use, beauty_return_or_refund]
    categories: [strong_correlation, unfavorable_reordering]
    rationale: Tests a natural failure-to-usability-to-remedy chain while retaining a plausible low-cost original.
    hypothesis: Malfunction and hard-to-use outcomes may be positively associated; return language should be conditionally enriched.
  - id: beauty_packaging_value
    dataset: amazon_all_beauty
    predicate_ids: [beauty_packaging_failure, beauty_poor_value]
    original_order: [beauty_packaging_failure, beauty_poor_value]
    categories: [weak_correlation, near_tied_orders]
    rationale: Contrasts a concrete packaging event with a broader value judgment in a two-predicate conjunction.
    hypothesis: Packaging failure and poor-value language may be only weakly associated and have similar marginal filtering value.
  - id: beauty_reaction_refund_packaging
    dataset: amazon_all_beauty
    predicate_ids: [beauty_adverse_reaction, beauty_return_or_refund, beauty_packaging_failure]
    original_order: [beauty_adverse_reaction, beauty_return_or_refund, beauty_packaging_failure]
    categories: [rare_event, unfavorable_reordering]
    rationale: Tests a sparse safety-related conjunction where the original rare predicate may already be a strong first filter.
    hypothesis: Adverse reactions should be rare; refund language may be enriched after a reaction while packaging may be largely unrelated.
  - id: beauty_usability_packaging_return
    dataset: amazon_all_beauty
    predicate_ids: [beauty_hard_to_use, beauty_packaging_failure, beauty_return_or_refund]
    original_order: [beauty_hard_to_use, beauty_packaging_failure, beauty_return_or_refund]
    categories: [near_tied_orders, weak_correlation]
    rationale: Tests plan uncertainty among concrete complaint predicates with potentially similar selectivity.
    hypothesis: Usability and packaging problems may be weakly related, with return intent conditionally enriched after either.
  - id: beauty_reaction_failure_value_return
    dataset: amazon_all_beauty
    predicate_ids: [beauty_adverse_reaction, beauty_malfunction, beauty_poor_value, beauty_return_or_refund]
    original_order: [beauty_adverse_reaction, beauty_malfunction, beauty_poor_value, beauty_return_or_refund]
    categories: [different_inference_costs, rare_event, four_predicate]
    rationale: Exercises four-predicate planning with a nuanced safety prompt and several shorter commercial judgments.
    hypothesis: Reaction is rare, malfunction and poor value may correlate, and prompt lengths will produce genuine usage-cost differences.
  - id: banking_unauthorized_card_refund
    dataset: banking77_queries
    predicate_ids: [banking_unauthorized_activity, banking_card_related, banking_refund_or_reversal]
    original_order: [banking_unauthorized_activity, banking_card_related, banking_refund_or_reversal]
    categories: [strong_correlation]
    rationale: Tests whether unrecognized card activity and requests for reversal form a strong support-query cluster.
    hypothesis: Unauthorized-activity queries should be enriched for card context and refund or reversal intent.
  - id: banking_withdrawal_access
    dataset: banking77_queries
    predicate_ids: [banking_cash_withdrawal, banking_access_or_verification]
    original_order: [banking_cash_withdrawal, banking_access_or_verification]
    categories: [weak_correlation, rare_event, near_tied_orders]
    rationale: Pairs an ATM/cash topic with an account-access topic that should usually arise independently.
    hypothesis: Both predicates may be selective and weakly associated, producing near-tied order estimates.
  - id: banking_unauthorized_withdrawal_refund
    dataset: banking77_queries
    predicate_ids: [banking_unauthorized_activity, banking_cash_withdrawal, banking_refund_or_reversal]
    original_order: [banking_unauthorized_activity, banking_cash_withdrawal, banking_refund_or_reversal]
    categories: [rare_event, unfavorable_reordering]
    rationale: Targets the sparse unauthorized-cash-withdrawal case with an already plausible original filter.
    hypothesis: The full conjunction should be rare; reversal language may be enriched after an unrecognized withdrawal.
  - id: banking_card_access
    dataset: banking77_queries
    predicate_ids: [banking_card_related, banking_access_or_verification]
    original_order: [banking_card_related, banking_access_or_verification]
    categories: [near_tied_orders, strong_correlation]
    rationale: Tests two broad support attributes that overlap for PIN, activation, loss, and compromised-card queries.
    hypothesis: Card-related and access/security language may be positively associated with similar marginal prevalence.
  - id: banking_transfer_unauthorized_refund_access
    dataset: banking77_queries
    predicate_ids: [banking_transfer_related, banking_unauthorized_activity, banking_refund_or_reversal, banking_access_or_verification]
    original_order: [banking_transfer_related, banking_unauthorized_activity, banking_refund_or_reversal, banking_access_or_verification]
    categories: [four_predicate, different_inference_costs, strong_correlation]
    rationale: Exercises four-predicate planning across transaction type, authorization, remedy, and account security.
    hypothesis: Unauthorized transfers may correlate with reversal requests, while access or verification language is a narrower conditional attribute.
