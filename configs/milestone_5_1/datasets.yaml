schema_version: m5.1-dataset-config-v1
raw_directory: data/raw/milestone_5
output_directory: data/milestone_5_1
partition_sizes:
  development: 50
  pilot: 40
  selection: 100
  evaluation: 400
historical_text_datasets:
  - data/processed/reviews_1000.parquet
  - data/milestone_4_6/amazon_all_beauty.parquet
  - data/milestone_4_6/banking77_queries.parquet
  - data/milestone_5/amazon_all_beauty.parquet
  - data/milestone_5/banking77_queries.parquet
