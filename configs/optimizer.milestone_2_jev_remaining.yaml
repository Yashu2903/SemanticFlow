split:
  seed: 2027
  profiling_size: 200
  evaluation_size: 800

profiling:
  concurrency: 4
  max_attempts: 1800

execution:
  # 2,640 authorized attempts minus 12 preserved transport failures.
  max_attempts_per_run: 2628
  cache_enabled: false

planner:
  objective: estimated_cost_usd
  tie_relative_tolerance: 1.0e-9
  cost_model_version: independent-and-v1
  optimizer_version: exhaustive-order-v1
  statistics_version: unconditional-profile-v1

mock_usage:
  input_tokens_per_evaluation: null
  output_tokens_per_evaluation: null
