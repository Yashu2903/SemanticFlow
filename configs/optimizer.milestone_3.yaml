split:
  seed: 2027
  profiling_size: 200
  evaluation_size: 800

profiling:
  concurrency: 4
  max_attempts: 1800

execution:
  max_attempts_per_run: 2640
  cache_enabled: false

planner:
  objective: estimated_cost_usd
  tie_relative_tolerance: 1.0e-9
  # The Milestone 2 independence model stays available as cardinality_estimator: independent
  # with cost_model_version: independent-and-v1.
  cardinality_estimator: correlation_aware
  cost_model_version: correlation-aware-and-v1
  optimizer_version: exhaustive-order-v1
  statistics_version: unconditional-profile-v1
  # minimum_expected_objective or confidence_aware (uses the bootstrap settings below).
  selection_policy: minimum_expected_objective

correlation:
  joint_statistics_version: joint-profile-v1
  # Beta pseudo-count; 1.0 gives the Jeffreys posterior mean for marginals.
  prior_strength: 1.0
  # Conditioning sets with fewer profiled rows are labelled low confidence.
  minimum_conditional_support: 20
  # Use token/latency means of rows that pass the preceding predicates.
  conditional_usage: true
  usage_prior_strength: 5.0
  allow_incomplete_matrix: false

economics:
  # null means unknown reuse; the planner then assumes one execution.
  expected_executions: null
  unknown_reuse_default_executions: 1
  profiling_budget_usd: null
  minimum_net_savings_usd: 0.0
  maximum_relative_uncertainty: null
  minimum_savings_probability: null
  statistics_reusable: true
  optimization_overhead_usd: 0.0

bootstrap:
  iterations: 1000
  seed: 3031
  interval_level: 0.95
  stability_threshold: 0.95
  confidence_level: 0.95
  minimum_relative_saving: 0.0

adaptive:
  checkpoints: [25, 50, 100, 150, 200]
  seed: 4049
  bootstrap_iterations: 1000
  stability_threshold: 0.95
  profiling_budget_usd: null
  maximum_profiling_decisions: null

mock_usage:
  input_tokens_per_evaluation: null
  output_tokens_per_evaluation: null
