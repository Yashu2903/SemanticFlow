split:
  seed: 2027
  profiling_size: 200
  evaluation_size: 800

profiling:
  concurrency: 4
  # Absolute retry-inclusive provider-attempt cap for profiling.
  max_attempts: 1800

execution:
  # Separate absolute cap for each held-out fixed or optimized run.
  max_attempts_per_run: 2640
  cache_enabled: false

planner:
  # Mock/offline runs use synthetic token counts to exercise token optimization.
  # Live runs must use measured provider token usage.
  objective: total_tokens
  tie_relative_tolerance: 1.0e-9
  cost_model_version: independent-and-v1
  optimizer_version: exhaustive-order-v1
  statistics_version: unconditional-profile-v1

mock_usage:
  input_tokens_per_evaluation: 100
  output_tokens_per_evaluation: 1
