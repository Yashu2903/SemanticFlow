query_id: mixed_feedback
workload_id: workload_g_mixed_feedback
dataset_path: data/processed/reviews_1000.parquet
dataset_version: semceb_amazon_arts_crafts_sewing_sample_1000
dataset_preparation_version: m1-v1
sample_seed: 2026
operation: and
limit: 1000
threshold: 0.5
max_calls: 3000
config_id: m3-mixed-feedback-v1
# Proposed Milestone 3 workload; no Jev outcomes exist for it yet. Expected regime:
# praise and problem reports are negatively correlated, so independence should
# overestimate the conjunction.
predicates:
  - id: praises_product
    instructions: Does the customer praise at least one aspect of the product?
  - id: reports_problem
    instructions: Does the customer report at least one problem or shortcoming with the product?
  - id: size_or_quantity_issue
    instructions: Does the customer say the size, dimensions, or quantity of the product differed from what they needed or expected?
